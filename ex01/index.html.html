<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Bốn mùa</title>
  <style>

    body {
      font-family: "Times New Roman", serif;
      font-size: 20px;
      font-style: italic;   
      text-align: center;  
    }


    .khung {
      width: 700px;
      margin: 30px auto;           
      padding: 25px;               
      background-color: #fdfde8;    
      border: 1px solid #aaaaaa;    
    }


    h1 {
      font-style: normal;           
      color: #cc0000;               
      background-color: #ffdde6;    
      padding: 12px;
      margin-bottom: 25px;
    }

    .xanh { color: #0022cc; }
    .do   { color: #dd0000; }

  
    hr {
      width: 60%;
      border: none;
      border-top: 1px solid #3366cc;
      margin: 20px auto;
    }
  </style>
</head>
<body>

  <div class="khung">
    <h1>BỐN MÙA</h1>


    <p class="xanh">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>

    <hr>

  
    <p class="do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>

    <hr>


    <p class="xanh">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </div>

</body>
</html>
